# Cloud Build pipeline for litellm-proxy (prod)
# Trigger: push to `main` branch on 1aboveio/litellm
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--tag'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:$COMMIT_SHA'
      - '--tag'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:${_TAG_NAME}'
      - '--tag'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:main-stable'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - '--image=us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:$COMMIT_SHA'
      - '--region=us-central1'
      - '--project=cosmic-heaven-479306-v5'
      - '--platform=managed'
      - '--port=4000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=3'
      - '--concurrency=80'
      - '--timeout=300'
      - '--cpu-boost'
      - '--command=litellm'
      - '--service-account=$_SERVICE_ACCOUNT'
      - '--add-cloudsql-instances=cosmic-heaven-479306-v5:us-central1:ai-dev'
      - '--no-allow-unauthenticated'
      - >-
        --set-env-vars=PORT=4000,STORE_MODEL_IN_DB=True,LITELLM_LOG=ERROR,LITELLM_MODE=PRODUCTION
      - >-
        --set-secrets=LITELLM_MASTER_KEY=litellm-master-key:latest,LITELLM_SALT_KEY=litellm-salt-key:latest,DATABASE_URL=litellm-database-url:latest,OPENAI_API_KEY=openai-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,/app/config.yaml=litellm-config:latest

images:
  - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:${_TAG_NAME}'
  - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:main-stable'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_NAME: litellm-proxy
  _TAG_NAME: main-stable
  _MIN_INSTANCES: '1'
  _SERVICE_ACCOUNT: litellm-proxy@cosmic-heaven-479306-v5.iam.gserviceaccount.com

