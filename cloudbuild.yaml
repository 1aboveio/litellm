# Cloud Build pipeline for litellm-proxy (dev)
# Trigger: push to `dev` branch on 1aboveio/litellm
# NOTE: PORT is set automatically by Cloud Run from --port flag. Do NOT set PORT
# via --set-env-vars — it is a reserved name and will cause deploy to fail.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--tag'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:$COMMIT_SHA'
      - '--tag'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:dev-$SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - litellm-proxy
      - '--image=us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:$COMMIT_SHA'
      - '--region=us-central1'
      - '--project=cosmic-heaven-479306-v5'
      - '--platform=managed'
      - '--port=4000'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--concurrency=80'
      - '--timeout=600'
      - '--cpu-boost'
      - '--command=litellm'
      - '--service-account=litellm-proxy@cosmic-heaven-479306-v5.iam.gserviceaccount.com'
      - '--no-allow-unauthenticated'
      - >-
        --set-env-vars=STORE_MODEL_IN_DB=True,LITELLM_LOG=ERROR,LITELLM_MODE=PRODUCTION
      - >-
        --set-secrets=LITELLM_MASTER_KEY=litellm-master-key:latest,LITELLM_SALT_KEY=litellm-salt-key:latest,DATABASE_URL=litellm-database-url:latest,OPENAI_API_KEY=openai-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest
      - '--update-secrets=/app/config.yaml=litellm-config:latest'

images:
  - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/cosmic-heaven-479306-v5/a1/litellm:dev-$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
